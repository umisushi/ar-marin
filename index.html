<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>共に行こう</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #ffeaf3;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0 5px;
    }

    p {
      margin-top: 0;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
    }

    #ar-button {
      background: white;
      border: none;
      border-radius: 30px;
      padding: 15px 25px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 12px #0003;
    }
  </style>
</head>

<body>

<h1>(^^♪ARまりりん(^^♪</h1>
<p>(*^_^*)</p>

<model-viewer
  src="marin.glb"
  ar
  ar-modes="quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1">

  <button slot="ar-button" id="ar-button">
    まりんと写真を撮ろう
  </button>

</model-viewer>

</body>
</html>
